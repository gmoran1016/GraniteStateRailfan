# Granite State Railfan - Cloudflare Pages Static Site Configuration
name = "granite-state-railfan"
compatibility_date = "2024-01-01"

# Build configuration
[build]
command = "echo 'Static site ready'"
cwd = "./"

# Environment variables
[env.production]
name = "granite-state-railfan"
vars = { SITE_NAME = "Granite State Railfan", SITE_DESCRIPTION = "Railfanning photography, videos, and New Hampshire railroad content" }
